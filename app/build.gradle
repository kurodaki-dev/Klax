plugins { id 'com.android.application' }

def generatedAssets = layout.buildDirectory.dir('generated/klax-assets')

// Single source of truth: the language core and the examples are copied into the app assets.
tasks.register('copyKlaxCore', Copy) {
    from("$rootDir/core/klax.js") { into 'web' }
    from("$rootDir/examples") { include '*.math'; into 'web/examples' }
    into generatedAssets
}

android {
    namespace 'dev.klax.app'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.klax.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            def ks = System.getenv('KLAX_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KLAX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KLAX_KEY_ALIAS')
                keyPassword System.getenv('KLAX_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KLAX_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir generatedAssets
    lint { abortOnError false }
}

tasks.named('preBuild') { dependsOn 'copyKlaxCore' }
