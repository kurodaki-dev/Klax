name: Build Klax

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a release

jobs:
  test-and-build:
    name: Tests + Acode plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the .math language and the plugin sources
        run: node scripts/test.js
      - name: Build the Acode plugin zip
        run: node scripts/build-plugin.js
        env:
          KLAX_VERSION: 1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: klax-math-acode-plugin
          path: dist/klax-math-plugin.zip

  release:
    name: Publish release
    # Every push to main publishes a release automatically; pushing a v* tag does too.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: klax-math-acode-plugin
          path: out
      - name: Pick the release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v1.0.${{ github.run_number }}"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Klax ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: out/klax-math-plugin.zip
